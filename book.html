<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>预约免费 Zoom 咨询 | Adtomatic</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script src="js/config.js"></script>
<script src="js/pixel.js"></script>
<style>
.card{border:3px solid var(--ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;margin-top:20px}
.card h2{margin:0;font-size:20px;font-weight:900}
.card h2 span{color:var(--red)}
.field{display:flex;flex-direction:column;gap:8px;font-size:16px;font-weight:900}
.field input,.field select,.field textarea{font-family:inherit;font-size:17px;font-weight:500;padding:14px;border:2px solid var(--ink);border-radius:8px;width:100%;background:#FFFFFF;color:var(--ink);min-height:52px}
.field textarea{min-height:100px;resize:vertical;line-height:1.6}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--red);background:var(--red-soft)}
.field small{font-weight:500;color:var(--mute);font-size:14px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chips button{min-height:56px;padding:8px;border-radius:10px;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;border:2px solid var(--ink);background:#FFFFFF;color:var(--ink)}
.chips button small{display:block;font-size:12px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.chips button.other{grid-column:1/-1;border-style:dashed}
.chosen{margin:0;font-size:16px;font-weight:700;background:var(--grey);border-radius:8px;padding:12px 14px}
.chosen span{color:var(--red)}
.err{margin:16px 0 0;color:var(--red);font-weight:900;text-align:center;display:none}
[hidden]{display:none !important}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn[disabled]{opacity:.7;cursor:wait}
@media (max-width:620px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px}}
</style>
</head>
<body>

<header class="topbar">
<div class="wrap narrow">
<img src="assets/logo.png" alt="Adtomatic">
<p><span>最后一步：</span>预约你的免费 Zoom 咨询</p>
</div>
</header>

<main class="wrap narrow" style="padding-bottom:48px">
<div class="book-head">
<div class="price-row"><span class="strike" style="font-size:17px">原价 RM399</span><span class="tag" style="font-size:17px;padding:4px 12px">限时免费</span></div>
<h1>选好时间，<span class="red">名额就是你的</span></h1>
<p>大约 1 分钟 · 本月剩余 <b class="red">2</b> 个名额</p>
</div>

<form id="book" novalidate>
<section class="card">
<h2><span>第 1 步</span>　告诉我们你的生意</h2>
<label class="field" id="f-name">你的名字<input type="text" id="name" autocomplete="name" placeholder="例如：Jason Tan"></label>
<label class="field" id="f-phone">WhatsApp 号码<input type="tel" id="phone" autocomplete="tel" inputmode="tel" placeholder="01X-XXX XXXX"></label>
<label class="field" id="f-ind">你的行业<select id="industry"><option value="">请选择</option><option>装修 / Renovation</option><option>地产 / Property</option><option>贷款 / Loan</option><option>教育 / 培训</option><option>餐饮 / F&amp;B</option><option value="其他">其他</option></select></label>
<label class="field" id="f-ind2" hidden>你的行业是？<input type="text" id="industry_other" placeholder="例如：美容院、汽车维修、保险"></label>
<label class="field">目前广告的 Cost Per Lead，或生意上遇到的挑战和问题<textarea id="challenge" placeholder="例如：每个 lead RM25，但 10 个只有 1 个肯约见面 / 还没开始跑广告，不知道从哪里开始"></textarea></label>
<label class="hp" aria-hidden="true">Website<input type="text" id="website" tabindex="-1" autocomplete="off"></label>
</section>

<section class="card">
<h2><span>第 2 步</span>　选你方便的时间</h2>
<p style="margin:-6px 0 0;color:var(--mute);font-size:15px">星期一至五 · 10AM – 9PM（马来西亚时间）· Zoom 45 分钟</p>
<div class="field" id="f-date">日期<div class="chips" id="days"></div></div>
<div class="field" id="f-time">时间<div class="chips" id="slots"></div></div>
<label class="field" id="f-custom" hidden>写下你方便的日期和时间<textarea id="custom_time" placeholder="例如：星期六早上 / 下个星期三晚上 9:30 之后"></textarea><small>我们会按你写的时间安排，同事会联络你确认</small></label>
<p class="chosen">你选的时间：<span id="chosen">还没选</span></p>
</section>

<p class="err" id="err" role="alert"></p>
<button type="submit" class="btn" id="submit" style="max-width:none;margin-top:20px">确认预约我的免费 Zoom →</button>
</form>

<div class="note" style="margin-top:20px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E11D1D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 28px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
<p><b>零风险：</b>就算 Zoom 之后不合作，90 天计划和同行拆解一样是你的。我们的同事会打电话 / WhatsApp 你确认时间和 Zoom 链接。</p>
</div>
<p style="text-align:center;margin:0"><a href="index.html" style="color:#555555">← 返回看完整内容</a></p>
</main>

<script>
fbq('track', 'ViewContent', { content_name: 'Booking page' });
(function () {
  var C = window.ADT || {};
  var WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var OTHER = '__other__';
  var st = { date: '', dateLabel: '', time: '' };
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // Industry "其他" -> ask them to type it
  $('industry').addEventListener('change', function () {
    $('f-ind2').hidden = $('industry').value !== '其他';
    if (!$('f-ind2').hidden) $('industry_other').focus();
  });

  // Dates: next N open days, Malaysia time
  var my = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kuala_Lumpur' }));
  var closed = C.closedWeekdays || [];
  var days = [];
  for (var i = 1; days.length < (C.daysAhead || 10) && i < 40; i++) {
    var d = new Date(my.getFullYear(), my.getMonth(), my.getDate() + i);
    if (closed.indexOf(d.getDay()) === -1) days.push({ d: d, tomorrow: i === 1 });
  }
  days.forEach(function (o) {
    var d = o.d, b = document.createElement('button'), label = (d.getMonth() + 1) + '/' + d.getDate();
    b.type = 'button'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<small>' + (o.tomorrow ? '明天' : WK[d.getDay()]) + '</small>' + label;
    b.addEventListener('click', function () {
      press('days', b);
      st.date = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      st.dateLabel = WK[d.getDay()] + ' ' + label;
      if (st.time === OTHER) { st.time = ''; press('slots', null); $('f-custom').hidden = true; }
      render();
    });
    $('days').appendChild(b);
  });

  // Time slots + "other time"
  (C.timeSlots || []).forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.textContent = t;
    b.addEventListener('click', function () { press('slots', b); st.time = t; $('f-custom').hidden = true; render(); });
    $('slots').appendChild(b);
  });
  var ob = document.createElement('button');
  ob.type = 'button'; ob.className = 'other'; ob.setAttribute('aria-pressed', 'false');
  ob.textContent = '以上时间都不方便？自己写你方便的时间';
  ob.addEventListener('click', function () {
    press('slots', ob); press('days', null);
    st.time = OTHER; st.date = ''; st.dateLabel = '';
    $('f-custom').hidden = false; $('custom_time').focus(); render();
  });
  $('slots').appendChild(ob);

  function press(group, btn) {
    $(group).querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'); });
  }
  function render() {
    $('chosen').textContent = st.time === OTHER ? '自己写的时间（见上面）'
      : (st.date || st.time ? (st.dateLabel || '请选日期') + ' · ' + (st.time || '请选时间') : '还没选');
    $('err').style.display = 'none';
  }
  function to24(t) {
    var m = t.match(/(\d+):(\d+)\s*(AM|PM)/i); if (!m) return '10:00';
    return pad(+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) + ':' + m[2];
  }
  function getCookie(n) { var m = document.cookie.match('(?:^|; )' + n + '=([^;]*)'); return m ? decodeURIComponent(m[1]) : ''; }

  ['name', 'phone', 'industry', 'industry_other', 'custom_time'].forEach(function (id) {
    ['input', 'change'].forEach(function (ev) { $(id).addEventListener(ev, function () { $(id).parentNode.classList.remove('bad'); }); });
  });

  $('book').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = {
      name: $('name').value.trim(), phone: $('phone').value.trim(),
      industry: $('industry').value, industry_other: $('industry_other').value.trim(),
      challenge: $('challenge').value.trim(), custom_time: $('custom_time').value.trim()
    };
    document.querySelectorAll('.field.bad').forEach(function (x) { x.classList.remove('bad'); });
    var miss = [];
    if (!v.name) { miss.push('名字'); $('f-name').classList.add('bad'); }
    if (v.phone.replace(/\D/g, '').length < 9) { miss.push('WhatsApp 号码'); $('f-phone').classList.add('bad'); }
    if (!v.industry) { miss.push('行业'); $('f-ind').classList.add('bad'); }
    if (v.industry === '其他' && !v.industry_other) { miss.push('你的行业'); $('f-ind2').classList.add('bad'); }
    if (st.time === OTHER) {
      if (!v.custom_time) { miss.push('你方便的时间'); $('f-custom').classList.add('bad'); }
    } else {
      if (!st.date) miss.push('日期');
      if (!st.time) miss.push('时间');
    }
    if (miss.length) { $('err').textContent = '请填写 / 选择：' + miss.join('、'); $('err').style.display = 'block'; return; }

    var custom = st.time === OTHER;
    var start = custom ? '' : st.date + 'T' + to24(st.time) + ':00+08:00';
    var whenText = custom ? v.custom_time : st.dateLabel + ' ' + st.time + '（马来西亚时间）';
    var industry = v.industry === '其他' ? '其他：' + v.industry_other : v.industry;

    // Tracking: browser Schedule + server CAPI Schedule with the same event id
    var eid = 'bk_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    fbq('track', 'Schedule', { content_name: 'Free Zoom' }, { eventID: eid });
    var qs = new URLSearchParams(location.search), fbclid = qs.get('fbclid');
    var utm = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].map(function (k) { return qs.get(k) ? k.slice(4) + '=' + qs.get(k) : ''; }).filter(Boolean).join('&');

    // Hand the booking to the thank-you page (WhatsApp confirm message + calendar)
    var info = { name: v.name, phone: v.phone, industry: industry, challenge: v.challenge, when: whenText, start: start, custom: custom };
    try { sessionStorage.setItem('adt_booking', JSON.stringify(info)); } catch (err) {}

    $('submit').disabled = true; $('submit').textContent = '提交中…';
    var done = false;
    function go(id) {
      if (done) return; done = true;
      location.href = 'thank-you.html?' + (start ? 'start=' + encodeURIComponent(start) + '&' : '') + (id ? 'ref=' + encodeURIComponent(id) : '');
    }
    var payload = {
      event_id: eid, name: v.name, phone: v.phone, industry: v.industry, industry_other: v.industry_other,
      challenge: v.challenge, date_label: custom ? '' : st.dateLabel, time: custom ? '' : st.time,
      custom_time: custom ? v.custom_time : '', start: start, utm: utm, website: $('website').value,
      fbp: getCookie('_fbp'), fbc: getCookie('_fbc') || (fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : ''),
      source_url: location.origin + '/book'
    };
    // Save to CRM, then go to thank-you. Never block the visitor for more than 5s.
    setTimeout(function () { go(''); }, 5000);
    fetch('/api/lead', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload), keepalive: true })
      .then(function (r) { return r.json(); })
      .then(function (j) { go(j && j.id); })
      .catch(function () { go(''); });
  });
})();
</script>
</body>
</html>
